name: Lint

on:
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    env:
      YARN_CACHE_FOLDER: ${{ github.workspace }}/lint/.yarn-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: ./.github/actions/setup-nvm

      - name: Clean yarn cache
        run: yarn cache clean

      - name: Cache yarn dependencies
        id: yarn-cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-yarn-deps-lint-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-deps-lint-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Lint
        run: yarn lint
